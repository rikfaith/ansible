<html xmlns="http://www.w3.org/1999/xhtml">
<head>
<meta http-equiv="Content-Type" content="text/html; charset=iso-8859-1" />
<title>Untitled Document</title>
<style type="text/css">

<script type="text/JavaScript">
<!--

function MM_findObj(n, d) { //v4.01
  var p,i,x;  if(!d) d=document; if((p=n.indexOf("?"))>0&&parent.frames.length) {
    d=parent.frames[n.substring(p+1)].document; n=n.substring(0,p);}
  if(!(x=d[n])&&d.all) x=d.all[n]; for (i=0;!x&&i<d.forms.length;i++) x=d.forms[i][n];
  for(i=0;!x&&d.layers&&i<d.layers.length;i++) x=MM_findObj(n,d.layers[i].document);
  if(!x && d.getElementById) x=d.getElementById(n); return x;
}

function MM_changeProp(objName,x,theProp,theValue) { //v6.0
  var obj = MM_findObj(objName);
  if (obj && (theProp.indexOf("style.")==-1 || obj.style)){
    if (theValue == true || theValue == false)
      eval("obj."+theProp+"="+theValue);
    else eval("obj."+theProp+"='"+theValue+"'");
  }
}

function MM_validateForm() { //v4.0
  var i,p,q,nm,test,num,min,max,errors='',args=MM_validateForm.arguments;
  for (i=0; i<(args.length-2); i+=3) { test=args[i+2]; val=MM_findObj(args[i]);
    if (val) { nm=val.name; if ((val=val.value)!="") {
      if (test.indexOf('isEmail')!=-1) { p=val.indexOf('@');
        if (p<1 || p==(val.length-1)) errors+='- '+nm+' must contain an e-mail address.\n';
      } else if (test!='R') { num = parseFloat(val);
        if (isNaN(val)) errors+='- '+nm+' must contain a number.\n';
        if (test.indexOf('inRange') != -1) { p=test.indexOf(':');
          min=test.substring(8,p); max=test.substring(p+1);
          if (num<min || max<num) errors+='- '+nm+' must contain a number between '+min+' and '+max+'.\n';
    } } } else if (test.charAt(0) == 'R') errors += '- '+nm+' is required.\n'; }
  } if (errors) alert('The following error(s) occurred:\n'+errors);
  document.MM_returnValue = (errors == '');
}

function SD_getVal(objName) {
  var obj = MM_findObj(objName);
  return obj.value;
}

function sqr(n) {
  var x1, x2, i;
  x1 = n / 2.;
  for (i = 0; i < 20; i++) {
  	x2 = .5 * (x1 + n / x1);
	x1 = x2;
  }
  return x2;
}

function MM_setTextOfTextfield(objName,x,newText) { //v3.0
  var obj = MM_findObj(objName); if (obj) obj.value = newText;
}

function SD_show(Name) {
	var obj = MM_findObj(Name);
	if (obj  && obj.style)
		obj.style.visibility='visible';
}

function SD_hide(Name) {
	var obj = MM_findObj(Name);
	if (obj  && obj.style)
		obj.style.visibility='hidden';
}

function MM_callJS(jsStr) { //v2.0
  return eval(jsStr)
}
//-->
</script>
</head>
<body>
<h2>Test of Dynamic Behaviors Using Javascript</h2>
<form action="" method="post" name="form1" id="form1">
  <table border="2" cellpadding="2" cellspacing="2">
    <tr>
      <td><input name="radiobutton" type="radio" onclick="MM_changeProp('dtext','','disabled',true,'INPUT/TEXT');MM_callJS('SD_hide(\'blink\')')" value="off" />
        Off </td>
      <td><input name="radiobutton" type="radio" onclick="MM_changeProp('dtext','','disabled',false,'INPUT/TEXT');MM_callJS('SD_show(\'blink\')')" value="on" checked="checked" />
        On </td>
    </tr>
    <tr>
      <td colspan="2"><input name="dtext" type="text"   disabled="enabled" value="1.3" size="8" maxlength="8" />
      </td>
    </tr>
    <tr>
      <td><input name="ival" type="text" onblur="MM_validateForm('ival','','RinRange1.1:4');return document.MM_returnValue" onchange="MM_setTextOfTextfield('oval','',sqr(SD_getVal('ival')))" value="1.0" size="4" maxlength="7"/></td>
      <td><input name="oval" type="text" value="2.0" size="4" maxlength="7"/></td>
    </tr>
    <tr>
      <td colspan="2"><p>This text stays</p>
        <div id="blink">This text comes and goes</div></td>
    </tr>
  </table>
</form>
</body>
</html>
