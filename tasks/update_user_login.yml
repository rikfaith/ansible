---
- name: Check if {{ default.nonroot_user }} exists
  become: true
  shell: id -u {{ default.nonroot_user }}
  register: user_exists
  ignore_errors: true

- name: Create new user
  when: user_exists != 0
  become: true
  user:
    name: "{{ default.nonroot_user }}"
    password: "{{ secret.nonroot_password }}"
    groups: "sudo"
    shell: "/bin/bash"

- name: Copy .ssh files
  copy:
    src: "/home/{{ default.nonroot_user }}/.ssh/{{ item }}"
    dest: "/home/{{ default.nonroot_user }}/.ssh"
    owner: "{{ default.nonroot_user }}"
    group: "{{ default.nonroot_user }}"
    mode: 0600
  with_items:
  - config
  - id_ed25519
  - id_ed25519.pub
  - github-rikfaith
  - github-rikfaith.pub
  - gitlab-rikfaith
  - gitlab-rikfaith.pub

# The web VM's urweb checkout is cloned from git@gitlab.com. The
# default identity is not registered on gitlab, so select the
# gitlab-rikfaith key for direct gitlab.com connections, and
# pre-accept the host key (the known_hosts copied from the build
# host has hashed entries for the build host's IP, which do not
# match the VM's).
- name: Select gitlab-rikfaith key for gitlab.com pulls
  when: vm_purpose is defined and vm_purpose == "web"
  blockinfile:
    path: "/home/{{ default.nonroot_user }}/.ssh/config"
    owner: "{{ default.nonroot_user }}"
    group: "{{ default.nonroot_user }}"
    mode: '0600'
    insertafter: BOF
    block: |
      Host gitlab.com
          Hostname gitlab.com
          IdentityFile ~/.ssh/gitlab-rikfaith
          User git
          IdentitiesOnly yes
          ForwardAgent no

- name: Accept gitlab.com host key for git pull
  when: vm_purpose is defined and vm_purpose == "web"
  become: true
  become_user: "{{ default.nonroot_user }}"
  shell: ssh-keyscan -t ed25519,rsa,ecdsa gitlab.com >> ~/.ssh/known_hosts 2>/dev/null
  changed_when: false

- name: Checkout dotfiles2
  git:
    repo: "{{ default.dotfiles_repo }}"
    dest: "/home/{{ default.nonroot_user }}/dotfiles2"
    key_file: "/home/{{ default.nonroot_user }}/.ssh/github-rikfaith"
    accept_hostkey: yes
  become: true
  become_user: "{{ default.nonroot_user }}"

- name: Install dotfiles2
  command: "./bootstrap.py"
  become: true
  become_user: "{{ default.nonroot_user }}"
  args:
    chdir: "/home/{{ default.nonroot_user }}/dotfiles2"

- name: Use zsh and update /etc/group
  user:
    name: "{{ default.nonroot_user }}"
    shell: /bin/zsh
    create_home: no
    append: yes
    groups: audio,cdrom,dialout,floppy,kvm,lp,sudo,tape,video

- name: Add to scanner group
  user:
    name: "{{ default.nonroot_user }}"
    create_home: no
    append: yes
    groups: scanner
  when: scanner_group is defined and scanner_group == True

- name: Activate zsh history
  file:
    path: "/home/{{ default.nonroot_user }}/.zhist"
    state: touch
    mode: 0600
    owner: "{{ default.nonroot_user }}"
    group: "{{ default.nonroot_user }}"

- name: Supply vimrc for root
  copy:
    dest: "/root/.vimrc"
    content: |
      syntax on
      if v:version > 720
        set mouse=r
      endif

- name: Update non-root user password
  user:
    name: "{{ default.nonroot_user }}"
    password: "{{ secret.nonroot_password }}"

- name: Update root user password
  user:
    name: "root"
    password: "{{ secret.root_password }}"
