---
# Configures the alephnull.com web VM: Apache 2.4 + php-fpm + per-site
# DokuWiki instances (current packaged stable, content migrated from the
# old buster VM). See ALEPHNULL-MIGRATION.md.
#
# The web content itself is placed by the vmdb copy-dir step
# (alephnull/www -> /www) before this playbook runs.

- name: Install testing repository (for python3-certbot-dns-digitalocean)
  copy:
    dest: /etc/apt/sources.list.d/devuan-testing.sources
    content: |
      Types: deb
      URIs: http://deb.devuan.org/merged/
      Suites: testing
      Components: main contrib non-free non-free-firmware
      Signed-By: /usr/share/keyrings/devuan-archive-keyring.gpg

# This works around a bug when using update_cache: yes
- name: Update apt cache for current distribution
  command: apt-get update

- name: Install web support packages
  apt:
    pkg:
    - apache2
    - cronolog
    - dokuwiki
    - gcc
    - libaugeas-dev
    - libpython3-dev
    - libpython3.13-dev
    - php-cli
    - php-fpm
    - php-gd
    - php-intl
    - php-mbstring
    - php-sqlite3
    - php-xml
    - python3.13
    - python3.13-dev
    - python3-certbot
    - python3-certbot-apache
    - python3-certbot-dns-digitalocean
    - python3-dev
    - python3-packaging
    - python3-virtualenv
    - sqlite3

# See https://github.com/certbot/certbot.git
- name: Install certbot
  pip:
    name:
      - certbot
      - certbot-apache
    virtualenv: /opt/certbot

# See https://ssl-config.mozilla.org
- name: Install version of options file, since certonly does not
  copy:
    dest: "/etc/letsencrypt/options-ssl-apache.conf"
    owner: root
    group: root
    mode: '0644'
    content: |
      SSLEngine on
      SSLProtocol             -all +TLSv1.2 +TLSv1.3
      SSLOpenSSLConfCmd       Curves X25519:prime256v1:secp384r1
      SSLCipherSuite          ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384:DHE-RSA-CHACHA20-POLY1305
      SSLHonorCipherOrder     off
      SSLSessionTickets       off

- name: Find installed php-fpm version
  shell: ls -d /etc/php/*/fpm | awk -F/ '{print $(NF-1)}' | head -1
  register: php_fpm_ver
  changed_when: false

- name: Create log directories
  file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: '0755'
  with_items:
  - /var/log/httpd
  - /var/log/httpd/alephnull.com
  - /var/log/httpd/bogus.org
  - /var/log/httpd/hillsboroughpeds.com
  - /var/log/httpd/hybridsky.org
  - /var/log/httpd/pineview82.org
  - /var/log/php-fpm

- name: Render per-site php-fpm pools
  template:
    src: alephnull/apache2/pool-d.j2
    dest: "/etc/php/{{ php_fpm_ver.stdout }}/fpm/pool.d/{{ item.name }}.conf"
    owner: root
    group: root
    mode: '0644'
  with_items: "{{ serving_sites | selectattr('php', 'equalto', true) | list }}"

- name: Render site vhosts
  template:
    src: alephnull/apache2/vhost.j2
    dest: "/etc/apache2/sites-available/{{ item.name }}.conf"
    owner: root
    group: root
    mode: '0644'
  with_items: "{{ all_sites }}"

- name: Enable site vhosts
  shell: a2ensite {{ item.name }}
  with_items: "{{ all_sites }}"

- name: Replace the packaged default site
  # Fallback vhost for names that match no site. 000-default sorts first
  # in sites-enabled, so it is the default :80 vhost. (The packaged one
  # serves "Apache2 Debian Default Page" from /var/www/html.) The page
  # itself lives in the repo at alephnull/www/default/ and is placed by
  # the vmdb copy-dir step.
  copy:
    dest: /etc/apache2/sites-available/000-default.conf
    owner: root
    group: root
    mode: '0644'
    content: |
      <VirtualHost *:80>
        ServerAdmin faith@alephnull.com
        DocumentRoot /www/default/docroot
      </VirtualHost>

- name: Enable the default site
  shell: a2ensite 000-default

- name: Enable required modules
  shell: a2enmod {{ item }}
  with_items:
  - access_compat
  - headers
  - proxy
  - proxy_fcgi
  - rewrite
  - ssl

- name: Disable unused modules
  shell: a2dismod {{ item }}
  with_items:
  - status

- name: Add local config to apache
  copy:
    dest: /etc/apache2/conf-available/local.conf
    owner: root
    group: root
    mode: '0644'
    content: |
      <Directory /www>
        Options FollowSymLinks
        AllowOverride None
        Require all granted
      </Directory>

- name: Add global ServerName
  copy:
    dest: /etc/apache2/conf-available/servername.conf
    owner: root
    group: root
    mode: '0644'
    content: |
      ServerName alephnull.com

- name: Enable local apache confs
  shell: a2enconf {{ item }}
  with_items:
  - local
  - servername

- name: Reduce server version disclosure
  lineinfile:
    path: /etc/apache2/conf-available/security.conf
    regexp: '^ServerTokens'
    line: 'ServerTokens Prod'
    state: present

- name: Turn off server signature
  lineinfile:
    path: /etc/apache2/conf-available/security.conf
    regexp: '^ServerSignature'
    line: 'ServerSignature Off'
    state: present

- name: Disable TRACE
  lineinfile:
    path: /etc/apache2/conf-available/security.conf
    regexp: '^TraceEnable'
    line: 'TraceEnable Off'
    state: present

- name: Install dokuwiki code into per-site instances
  # Merges the packaged (current stable) dokuwiki into each site's
  # support/ directory, where the migrated conf/ and data/ already are.
  # The Debian package splits the instance three ways: code in
  # /usr/share/dokuwiki, config in /etc/dokuwiki, writable dirs in
  # /var/lib/dokuwiki. The lib/tpl and lib/plugins symlinks (which point
  # at the global /var/lib/dokuwiki dirs) are excluded so each site keeps
  # its own real lib/tpl (migrated custom templates + the default one)
  # and its own lib/plugins. The package conf (dokuwiki.php, *.conf,
  # *.dist) is merged over the site conf; the site's local.php and
  # users.auth.php have no name clash and are kept.
  # tar -C is used (rather than cd subshells) so the tar stream can't be
  # polluted if a parent shell exports CDPATH (bash cd prints in that case).
  # The acl.auth.php/users.auth.php package entries are symlinks into the
  # global /var/lib/dokuwiki/acl/; they are excluded so each site keeps
  # its own real auth files.
  shell: >
    tar cf - -C /usr/share/dokuwiki --exclude=lib/tpl --exclude=lib/plugins .htaccess.dist .htaccess.dist.md5sum VERSION bin doku.php feed.php index.php inc lib vendor | tar xf - -C /www/{{ item }}/support && cp -a /var/lib/dokuwiki/lib/tpl/dokuwiki /www/{{ item }}/support/lib/tpl/ && tar cf - -C /etc/dokuwiki --exclude=acl.auth.php --exclude=users.auth.php . | tar xf - -C /www/{{ item }}/support/conf/ && mkdir -p /www/{{ item }}/support/data/attic /www/{{ item }}/support/data/cache /www/{{ item }}/support/data/index /www/{{ item }}/support/data/locks /www/{{ item }}/support/data/log /www/{{ item }}/support/data/media /www/{{ item }}/support/data/media_attic /www/{{ item }}/support/data/media_meta /www/{{ item }}/support/data/meta /www/{{ item }}/support/data/pages /www/{{ item }}/support/data/tmp
  with_items: "{{ wiki_sites }}"

- name: Ensure per-site plugin directories exist
  # lib/plugins did not exist after the code merge: in the Debian
  # package it is a symlink, excluded from the merge.
  file:
    path: "/www/{{ item }}/support/lib/plugins"
    state: directory
  with_items: "{{ wiki_sites }}"

- name: Install core dokuwiki extensions into per-site instances
  # The Debian package bundles no extensions. This is the curated core
  # set from the official 2026-07-14c "Mort" tarball (the version apt
  # installs from the Devuan testing repo). authplain is the cryptplain
  # successor and reads the migrated conf/users.auth.php as-is (its
  # PassHash supports the md5/md5crypt/bcrypt hashes in it). Note the
  # support/passwords files are a different thing: Apache htpasswd files
  # for Basic auth, used via .htaccess (30th/, 20th/, raw/, downloads/
  # on pineview82.org).
  # unarchive (not copy) because the build host's ansible 2.20 copy
  # module dropped the recurse parameter, and synchronize does not work
  # over the chroot connection. The tarball is a snapshot of
  # alephnull/dokuwiki-plugins/ (regenerate with:
  # tar czf dokuwiki-plugins.tar.gz -C dokuwiki-plugins .).
  unarchive:
    src: alephnull/dokuwiki-plugins.tar.gz
    dest: "/www/{{ item }}/support/lib/plugins/"
  with_items: "{{ wiki_sites }}"

- name: Create per-site ACL files
  # The migrated sites run with useacl=1 but had no acl file; in this
  # dokuwiki a missing acl file means AUTH_NONE (nothing readable), so
  # give a baseline: everyone reads, the user group edits/uploads, the
  # admin group has full control. Adjust permissions here if needed.
  copy:
    dest: "/www/{{ item }}/support/conf/acl.auth.php"
    owner: root
    group: root
    mode: '0644'
    content: |
      # <namespace> <user or @group> <permissions>
      # 1=read 2=edit 4=upload 8=delete 16=create 128=configure 255=admin
      * @ALL 1
      * @user 6
      * @admin 255
  with_items: "{{ wiki_sites }}"

- name: Drop stale per-site prepend.php
  # The migrated prepend.php redefined DOKU_CONF/DOKU_INC in the old style
  # (a bare define of the already-defined DOKU_INC is fatal on modern
  # PHP). With the code copied into support/, the dokuwiki defaults
  # (DOKU_INC/conf, DOKU_INC/data) already match the per-site layout.
  file:
    path: "/www/{{ item }}/support/prepend.php"
    state: absent
  with_items: "{{ wiki_sites }}"

- name: Make wiki data, conf and extensions owned by fpm
  # conf must be writable so dokuwiki can edit acl.auth.php (sites run
  # with useacl=1) and users.auth.php via the admin UI.
  shell: >
    chown -R www-data:www-data
    /www/{{ item }}/support/data /www/{{ item }}/support/conf /www/{{ item }}/support/lib/plugins
  with_items: "{{ wiki_sites }}"

- name: Create logrotate config for cronolog and php-fpm logs
  copy:
    dest: /etc/logrotate.d/alephnull
    owner: root
    group: root
    mode: '0644'
    content: |
      /var/log/httpd/*/*/*.log {
          daily
          rotate 30
          compress
          delaycompress
          missingok
          notifempty
      }

      /var/log/php-fpm/*.log {
          daily
          rotate 30
          compress
          missingok
          notifempty
      }

- name: Install DigitalOcean credentials for alephnull.com
  copy:
    dest: /root/digitalocean-alephnull.ini
    owner: root
    group: root
    mode: '0600'
    content: |
      dns_digitalocean_token = "{{ default.web_alephnull_token }}"

- name: Get Let's Encrypt certificates (DigitalOcean DNS)
  shell: >
    certbot certonly --agree-tos -n -m rikfaith@gmail.com
    --preferred-challenges dns
    -d {{ item.domains }}
    --dns-digitalocean
    --dns-digitalocean-credentials /root/digitalocean-alephnull.ini
  with_items:
  - { domains: "alephnull.com,www.alephnull.com,test.alephnull.com" }
  - { domains: "bogus.org,www.bogus.org,test.bogus.org,so.bogus.org" }
  - { domains: "clepperfaith.com,www.clepperfaith.com,clepper-faith.com,www.clepper-faith.com" }
  - { domains: "hillsboroughpeds.com,www.hillsboroughpeds.com,test.hillsboroughpeds.com" }
  - { domains: "hybridsky.org,www.hybridsky.org,test.hybridsky.org" }
  - { domains: "pineview82.org,www.pineview82.org,test.pineview82.org" }
  - { domains: "tarball.org,www.tarball.org,test.tarball.org" }
  - { domains: "urmp.org,www.urmp.org,test.urmp.org" }

- name: Add cert renewal to /etc/crontab
  blockinfile:
    dest: /etc/crontab
    block: |
      17   3  10,20 * * root certbot renew --post-hook "apache2ctl graceful"
