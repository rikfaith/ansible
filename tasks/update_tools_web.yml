---
- name: Install testing repository (for python3-certbot-dns-digitalocean)
  when: vm_purpose is defined and (vm_purpose == "web" or vm_purpose == "dict")
  copy:
    dest: /etc/apt/sources.list.d/devuan-testing.sources
    content: |
      Types: deb
      URIs: http://deb.devuan.org/merged/
      Suites: testing
      Components: main contrib non-free non-free-firmware
      Signed-By: /usr/share/keyrings/devuan-archive-keyring.gpg

# This works around a bug when using update_cache: yes
- name: Update apt cache for current distribution
  when: vm_purpose is defined and (vm_purpose == "web" or vm_purpose == "dict")
  command: apt-get update

#       - libpython3.13-dev  <-- needed for certbot Fri Oct  2 05:40:38 2026
- name: Install apache tools
  when: vm_purpose is defined and (vm_purpose == "web" or vm_purpose == "dict")
  apt:
    pkg:
      - apache2
      - cronolog
      - gcc
      - libaugeas-dev
      - libpython3.13-dev
      - libpython3-dev
      - links
      - nodejs
      - npm
      - python3.13
      - python3.13-dev
      - python3-certbot
      - python3-certbot-apache
      - python3-certbot-dns-digitalocean
      - python3-certbot-dns-rfc2136
      - python3-dev
      - python3-virtualenv

- name: Install certbot
  when: vm_purpose is defined and (vm_purpose == "web" or vm_purpose == "dict")
  pip:
    name:
      - certbot
      - certbot-apache
    virtualenv: /opt/certbot

# See https://github.com/certbot/certbot.git
# And https://ssl-config.mozilla.org
- name: Install version of options file, since certonly does not
  when: vm_purpose is defined and (vm_purpose == "web" or vm_purpose == "dict")
  copy:
    dest: "/etc/letsencrypt/options-ssl-apache.conf"
    owner: root
    group: root
    mode: '0644'
    content: |
      SSLEngine on
      SSLProtocol             -all +TLSv1.2 +TLSv1.3
      SSLOpenSSLConfCmd       Curves X25519:prime256v1:secp384r1
      SSLCipherSuite          ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384:DHE-RSA-CHACHA20-POLY1305
      SSLHonorCipherOrder     off
      SSLSessionTickets       off

- name: Install DigitalOcean credentials for panpedia.org
  when: vm_purpose is defined and vm_purpose == "web"
  copy:
    dest: "/root/digitalocean-panpedia.ini"
    owner: root
    group: root
    mode: '0600'
    content: |
      dns_digitalocean_token = "{{ secret.web_panpedia_token }}"

- name: Install DigitalOcean credentials for dict.org
  when: vm_purpose is defined and vm_purpose == "dict"
  copy:
    dest: "/root/digitalocean-dict.ini"
    owner: root
    group: root
    mode: '0600'
    content: |
      dns_digitalocean_token = "{{ secret.web_dict_token }}"

- name: Get certificate for dict.org
  when: vm_purpose is defined and vm_purpose == "dict"
  shell: certbot certonly --agree-tos -n --preferred-challenges dns -d dict.org,www.dict.org,alt0.dict.org,alt1.dict.org,test.dict.org --dns-digitalocean --dns-digitalocean-credentials /root/digitalocean-dict.ini

- name: Get certificate for panpedia.org
  when: vm_purpose is defined and vm_purpose == "web"
  shell: certbot certonly --agree-tos -n --preferred-challenges dns -d panpedia.org,www.panpedia.org,local.panpedia.org,panpedia.panpedia.org -m lukem1900@gmail.com --dns-digitalocean --dns-digitalocean-credentials /root/digitalocean-panpedia.ini

- name: Add cert renewal to /etc/crontab
  when: vm_purpose is defined and vm_purpose == "web"
  blockinfile:
    dest: /etc/crontab
    block: |
      17   3  10,20 * * root certbot renew --post-hook "apache2ctl graceful"

- name: Add local config to apache
  when: vm_purpose is defined and (vm_purpose == "web" or vm_purpose == "dict")
  copy:
    dest: "/etc/apache2/conf-available/local.conf"
    owner: root
    group: root
    mode: '0644'
    content: |
      <Directory /www>
          Options FollowSymLinks
          AllowOverride None
          Require all granted
      </Directory>

- name: Reduce apache server version disclosure
  when: vm_purpose is defined and (vm_purpose == "web" or vm_purpose == "dict")
  block:
    - name: Set ServerTokens to Prod
      lineinfile:
        path: /etc/apache2/conf-available/security.conf
        regexp: '^ServerTokens'
        line: 'ServerTokens Prod'
        state: present

    - name: Turn off server signature
      lineinfile:
        path: /etc/apache2/conf-available/security.conf
        regexp: '^ServerSignature'
        line: 'ServerSignature Off'
        state: present

    - name: Disable TRACE and limit request body size
      blockinfile:
        path: /etc/apache2/conf-available/security.conf
        block: |
          TraceEnable Off
          LimitRequestBody 10485760

- name: Listen only on port 443
  when: vm_purpose is defined and vm_purpose == "web"
  copy:
    dest: /etc/apache2/ports.conf
    owner: root
    group: root
    mode: '0644'
    content: |
      Listen 443

      <IfModule ssl_module>
          SSLSessionCache "shmcb:/var/run/apache2/ssl_scache(512000)"
          SSLSessionCacheTimeout  300
      </IfModule>

- name: Create default docroot placeholder page
  when: vm_purpose is defined and vm_purpose == "web"
  block:
    - name: Create default docroot
      file:
        path: /www/default/docroot
        state: directory
        owner: root
        group: root
        mode: '0755'

    - name: Write placeholder index.html
      copy:
        dest: /www/default/docroot/index.html
        owner: root
        group: root
        mode: '0644'
        content: |
          <!DOCTYPE html>
          <html>
          <head>
            <title>Nothing is here yet</title>
          </head>
          <body>
            <h1>Nothing is here yet</h1>
          </body>
          </html>

- name: Create default log directory
  when: vm_purpose is defined and vm_purpose == "web"
  file:
    path: /var/log/httpd/default
    state: directory
    owner: root
    group: root
    mode: '0755'

- name: Add default https config to apache
  when: vm_purpose is defined and vm_purpose == "web"
  copy:
    dest: "/etc/apache2/sites-available/000-default.conf"
    owner: root
    group: root
    mode: '0644'
    content: |
      <VirtualHost _default_:443>
        ServerAdmin webadmin@panpedia.org
        DocumentRoot /www/default/docroot

        SSLEngine on
        SSLCertificateFile    /etc/letsencrypt/live/panpedia.org/fullchain.pem
        SSLCertificateKeyFile /etc/letsencrypt/live/panpedia.org/privkey.pem
        Include               /etc/letsencrypt/options-ssl-apache.conf

        Header always set Strict-Transport-Security "max-age=63072000; includeSubDomains"

        TransferLog "|/usr/bin/cronolog /var/log/httpd/default/%Y/%m/access.%Y%m%d.log"
        ErrorLog "|/usr/bin/cronolog /var/log/httpd/default/%Y/%m/error.%Y%m%d.log"
      </VirtualHost>

- name: Remove retired m.panpedia.org site
  when: vm_purpose is defined and vm_purpose == "web"
  file:
    path: "{{ item }}"
    state: absent
  with_items:
    - /etc/apache2/sites-available/m.panpedia.org.conf
    - /etc/apache2/sites-enabled/m.panpedia.org.conf

- name: Activate modules
  when: vm_purpose is defined and (vm_purpose == "web" or vm_purpose == "dict")
  shell: a2enmod "{{ item }}"
  with_items:
  - cgi
  - headers
  - rewrite
  - ssl

- name: Disable unneeded modules
  when: vm_purpose is defined and vm_purpose == "web"
  shell: a2dismod "{{ item }}"
  with_items:
  - autoindex
  - cgi
  - status
  - userdir

- name: Activate local.conf
  when: vm_purpose is defined and (vm_purpose == "web" or vm_purpose == "dict")
  shell: a2enconf local
