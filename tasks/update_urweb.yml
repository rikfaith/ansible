---
# /web is a plain directory at image-build time, but a mountpoint on a
# file server (persistent storage) when the VM is running. Everything
# below is therefore provisioned into /web.baseline; on first boot
# /root/firstboot.sh copies the baseline into /web, and all later
# changes happen in /web. The apache vhost points at the runtime paths
# under /web/urweb.

- name: Install firstboot.sh
  when: vm_purpose is defined and vm_purpose == "web"
  copy:
    dest: /root/firstboot.sh
    owner: root
    group: root
    mode: '0755'
    content: |
      #!/bin/sh
      # First boot for the web VM: issue the TLS certificate, copy the
      # built baseline into the persistent /web mount, then restart
      # apache.
      set -eu

      # Issued here, not during the image build, so failed builds do
      # not consume Let's Encrypt's weekly per-domain quota. This runs
      # before the /web/urweb check on purpose: after a rebuild,
      # /etc/letsencrypt is empty again while /web persists, and the
      # cert still needs re-issuing. A no-op if a valid cert exists.
      certbot certonly --agree-tos -n --preferred-challenges dns \
          -d panpedia.org,www.panpedia.org,local.panpedia.org,panpedia.panpedia.org \
          -m lukem1900@gmail.com \
          --dns-digitalocean \
          --dns-digitalocean-credentials /root/digitalocean-panpedia.ini

      if [ -e /web/urweb ]; then
          echo "firstboot.sh: /web/urweb already exists." >&2
          echo "It will not be overwritten. To update the live tree:" >&2
          echo "    cd /web/urweb && git pull" >&2
          exit 1
      fi

      cp -a /web.baseline/. /web/
      /etc/init.d/apache2 restart

- name: Install apache wsgi module
  when: vm_purpose is defined and vm_purpose == "web"
  apt:
    pkg:
      - libapache2-mod-wsgi-py3

- name: Create urweb web root
  when: vm_purpose is defined and vm_purpose == "web"
  file:
    path: /web.baseline/urweb
    state: directory
    owner: "{{ default.nonroot_user }}"
    group: "{{ default.nonroot_user }}"
    mode: '0755'

- name: Install uv
  when: vm_purpose is defined and vm_purpose == "web"
  block:
    - name: Download uv release tarball
      get_url:
        url: "https://github.com/astral-sh/uv/releases/download/0.13.9/uv-x86_64-unknown-linux-gnu.tar.gz"
        dest: /usr/local/src/uv-0.13.9.tar.gz
        checksum: "sha256:a7fbaff2b9a271d85c1bdb540941090fd1ce011797b4abeb48e4dcd39c2471d5"
        mode: '0644'

    - name: Install uv binaries
      unarchive:
        src: /usr/local/src/uv-0.13.9.tar.gz
        dest: /usr/local/bin
        remote_src: yes
        mode: '0755'
        include:
          - uv
          - uvx
        extra_opts:
        - --no-anchored
        - --strip-components=1

    - name: Remove uv tarball
      file:
        path: /usr/local/src/uv-0.13.9.tar.gz
        state: absent

- name: Install gitlab key for urweb checkout
  when: vm_purpose is defined and vm_purpose == "web"
  copy:
    src: "/home/{{ default.nonroot_user }}/.ssh/{{ item }}"
    dest: "/root/.ssh"
    owner: root
    group: root
    mode: '0600'
  with_items:
  - gitlab-rikfaith
  - gitlab-rikfaith.pub

- name: Remove stale urweb checkout from a previously cached rootfs
  when: vm_purpose is defined and vm_purpose == "web"
  file:
    path: /web.baseline/urweb
    state: absent

- name: Checkout urweb
  when: vm_purpose is defined and vm_purpose == "web"
  git:
    repo: "git@gitlab.com:rikfaith/urweb.git"
    dest: /web.baseline/urweb
    version: main
    key_file: /root/.ssh/gitlab-rikfaith
    accept_hostkey: yes
    recursive: yes

- name: Give urweb ownership of its tree
  when: vm_purpose is defined and vm_purpose == "web"
  file:
    path: /web.baseline/urweb
    state: directory
    owner: "{{ default.nonroot_user }}"
    group: "{{ default.nonroot_user }}"
    recurse: true

- name: Build urweb venv
  when: vm_purpose is defined and vm_purpose == "web"
  command: uv sync --no-dev
  args:
    chdir: /web.baseline/urweb
  become: true
  become_user: "{{ default.nonroot_user }}"

- name: Create urweb session directory
  when: vm_purpose is defined and vm_purpose == "web"
  file:
    path: /web.baseline/urweb/.flask_sessions
    state: directory
    owner: "{{ default.nonroot_user }}"
    group: "{{ default.nonroot_user }}"
    mode: '0700'

- name: Create urweb config directory
  when: vm_purpose is defined and vm_purpose == "web"
  file:
    path: /etc/urweb
    state: directory
    owner: "{{ default.nonroot_user }}"
    group: "{{ default.nonroot_user }}"
    mode: '0755'

- name: Install urweb config from build host
  when: vm_purpose is defined and vm_purpose == "web"
  copy:
    src: /root/urweb-config.toml
    remote_src: yes
    dest: /etc/urweb/config.toml
    owner: "{{ default.nonroot_user }}"
    group: "{{ default.nonroot_user }}"
    mode: '0600'

- name: Point urweb config at the remote database
  when: vm_purpose is defined and vm_purpose == "web"
  block:
    - name: Set database host in urweb config
      lineinfile:
        path: /etc/urweb/config.toml
        regexp: '^host = '
        line: 'host = "pgsql.alephnull.com"'

    - name: Set database password in urweb config
      lineinfile:
        path: /etc/urweb/config.toml
        regexp: '^password = '
        line: 'password = "{{ secret.urweb_password }}"'

- name: Remove staged urweb config
  when: vm_purpose is defined and vm_purpose == "web"
  file:
    path: /root/urweb-config.toml
    state: absent

- name: Create urweb log directory
  when: vm_purpose is defined and vm_purpose == "web"
  file:
    path: /var/log/httpd/panpedia.org
    state: directory
    owner: root
    group: root
    mode: '0755'

- name: Pass URWEB_CONFIG to the mod_wsgi daemon
  when: vm_purpose is defined and vm_purpose == "web"
  # The WSGI daemon process inherits its environment from the apache
  # parent; SetEnv in the vhost does not reach it, and there is no
  # env= option on WSGIDaemonProcess. /etc/apache2/envvars is sourced
  # by apachectl / the init script at startup. Changing it requires a
  # full 'service apache2 restart' (a SIGHUP restart reuses the
  # master's environment).
  lineinfile:
    path: /etc/apache2/envvars
    regexp: '^export URWEB_CONFIG='
    line: 'export URWEB_CONFIG=/etc/urweb/config.toml'

- name: Add urweb vhost to apache
  when: vm_purpose is defined and vm_purpose == "web"
  copy:
    dest: /etc/apache2/sites-available/panpedia.org.conf
    owner: root
    group: root
    mode: '0644'
    content: |
      <VirtualHost *:443>
        ServerName panpedia.org
        ServerAlias www.panpedia.org local.panpedia.org panpedia.panpedia.org
        ServerAdmin webadmin@panpedia.org

        SSLEngine on
        SSLCertificateFile    /etc/letsencrypt/live/panpedia.org/fullchain.pem
        SSLCertificateKeyFile /etc/letsencrypt/live/panpedia.org/privkey.pem
        Include               /etc/letsencrypt/options-ssl-apache.conf

        Header always set Strict-Transport-Security "max-age=63072000; includeSubDomains"

        # Forward the client IP to the WSGI app, which trusts the
        # first X-Forwarded-For entry (ProxyFix) for login logging.
        RequestHeader set X-Forwarded-For "%{REMOTE_ADDR}s"

        WSGIDaemonProcess urweb processes=2 threads=15 user={{ default.nonroot_user }} group={{ default.nonroot_user }} python-home=/web/urweb/.venv python-path=/web/urweb
        WSGIProcessGroup urweb
        WSGIScriptAlias / /web/urweb/wsgi.py
        # URWEB_CONFIG is passed via /etc/apache2/envvars; SetEnv
        # does not reach a mod_wsgi daemon process.

        <Directory /web/urweb>
          Require all granted
        </Directory>

        TransferLog "|/usr/bin/cronolog /var/log/httpd/panpedia.org/%Y/%m/access.%Y%m%d.log"
        ErrorLog "|/usr/bin/cronolog /var/log/httpd/panpedia.org/%Y/%m/error.%Y%m%d.log"
      </VirtualHost>

- name: Activate urweb vhost
  when: vm_purpose is defined and vm_purpose == "web"
  shell: a2ensite panpedia.org

- name: Activate wsgi module
  when: vm_purpose is defined and vm_purpose == "web"
  shell: a2enmod wsgi
